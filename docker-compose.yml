services:
  mysql:
    # Series tag on an LTS: patches arrive on a plain pull, majors never do.
    image: mariadb:11.4
    # Prefixed: a bare "mysql" collides with any other stack on the host.
    container_name: piler-mysql
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - dac_override
      - setuid
      - setgid
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-piler}
      - MYSQL_USER=${MYSQL_USER:-piler}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-piler123}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    command: >
      --port=${MYSQL_PORT:-3306}
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./config/piler.cnf:/etc/mysql/conf.d/piler.cnf:ro
    # Upstream's own probe. --innodb_initialized rather than a bare --connect:
    # the first start initialises the data directory and restarts the server
    # mid-way, and a plain connect passes during that window.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: "5s"
      timeout: "5s"
      start_period: "60s"
      retries: 12

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: piler-manticore
    restart: unless-stopped
    # tty: true works around the manticore entrypoint chowning /dev/stdout,
    # which fails under rootless podman and (with set -e) kills the container.
    # :Z on the config bind mount is needed for SELinux (enforcing hosts, eg. Fedora)
    # so the manticore process can actually read the file.
    # Manticore version is pinned to 14.1.0: it's the version piler 1.4.9 was
    # built/tested against; newer majors (eg. 25.x) break it. Exact patch
    # because upstream publishes no 14.1 or 14 series tag.
    tty: true
    volumes:
      - ./config/manticore.conf:/etc/manticoresearch/manticore.conf:Z
      - piler_manticore:/var/lib/manticore
    # Ports are manticore.conf's own, not MANTICORE_PORT: that variable only
    # tells piler where to dial. Looking for piler1 rather than "select 1"
    # proves the RT indexes are loaded, which is what piler actually needs.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysql -h127.0.0.1 -P9306 -Ne 'show tables' | grep -q piler1 && mysql -h127.0.0.1 -P9307 -Ne 'select 1' >/dev/null"
      interval: "5s"
      timeout: "5s"
      start_period: "60s"
      retries: 12
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M

  piler:
    image: ${PILER_IMAGE:-ghcr.io/nethserver/piler-server:latest}
    container_name: piler
    # Covers a crash: the process exiting on its own is restarted, so
    # exit-on-fatal no longer leaves a dead archive -- at the cost of looping
    # on a fatal config error. It does NOT cover a host reboot under rootless
    # podman, which needs `systemctl --user enable podman-restart.service`.
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Defaults live here; .env.example documents each one. RT and PILER_USER
    # are deliberately absent: neither has a working second value.
    environment:
      - PILER_HOSTNAME=${PILER_HOSTNAME:-archive.example.com}
      - MYSQL_HOSTNAME=${MYSQL_HOSTNAME:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-piler}
      - MYSQL_USER=${MYSQL_USER:-piler}
      # No '%': piler's cron scripts parse piler.conf with configparser.
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-piler123}
      - MYSQL_WAIT_MAX_ATTEMPTS=${MYSQL_WAIT_MAX_ATTEMPTS:-60}
      - MANTICORE_HOSTNAME=${MANTICORE_HOSTNAME:-manticore}
      - MANTICORE_PORT=${MANTICORE_PORT:-9306}
      - MANTICORE_PORT_READONLY=${MANTICORE_PORT_READONLY:-9307}
      - MEMCACHED_HOSTNAME=${MEMCACHED_HOSTNAME:-memcached}
      - MEMCACHED_PORT=${MEMCACHED_PORT:-11211}
      - PILER_STOP_DRAIN=${PILER_STOP_DRAIN:-1}
      - PILER_STOP_DRAIN_TIMEOUT=${PILER_STOP_DRAIN_TIMEOUT:-300}
      - PILER_STOP_DRAIN_INTERVAL=${PILER_STOP_DRAIN_INTERVAL:-2}
      # No '=': entrypoint.sh tests both with [[ -v ]], so an empty value is
      # not the same as absent -- it would prefix with "/" and blank the hash.
      - PATH_PREFIX
      - ADMIN_USER_PASSWORD_HASH
    # Host side only; the container keeps 25 and 80. No 443: nginx here serves
    # plain HTTP and the generated certificate is the SMTP STARTTLS one, so
    # HTTPS belongs to a reverse proxy in front.
    ports:
      - "${HOST_SMTP_PORT:-25}:25"
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - piler_etc:/etc/piler
      - piler_store:/var/piler/store
      - piler_spool:/var/piler/tmp
    # Long enough for the drain in config/piler-run.sh; the 10s default would
    # SIGKILL the container mid-spool.
    stop_grace_period: 360s
    # Mirrors the image HEALTHCHECK, which podman's OCI format drops.
    healthcheck:
      test: curl -fsS http://localhost/ >/dev/null && curl -fsS --max-time 3 smtp://localhost:25/ >/dev/null
      interval: "20s"
      timeout: "3s"
      start_period: "15s"
      retries: 3
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M
    # piler's entrypoint waits for the database on its own, for the deployments
    # that run this image without compose; the condition here is what makes
    # `up` block instead of racing, and it reports the failure as a dependency.
    depends_on:
      mysql:
        condition: service_healthy
      memcached:
        condition: service_healthy
      manticore:
        condition: service_healthy

  memcached:
    image: memcached:1.6-alpine
    container_name: piler-memcached
    restart: unless-stopped
    command: -m 64 -p ${MEMCACHED_PORT:-11211}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "echo version | nc -w 2 127.0.0.1 ${MEMCACHED_PORT:-11211} | grep -q VERSION"
      interval: "10s"
      timeout: "5s"
      start_period: "10s"
      retries: 3

volumes:
  db_data: {}
  piler_etc: {}
  piler_manticore: {}
  piler_spool: {}
  piler_store: {}
