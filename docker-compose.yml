services:
  mysql:
    image: mariadb:12.0.2
    container_name: mysql
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - dac_override
      - setuid
      - setgid
    environment:
      - MYSQL_DATABASE=piler
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=piler123
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./config/piler.cnf:/etc/mysql/conf.d/piler.cnf:ro

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: manticore
    restart: unless-stopped
    # tty: true works around the manticore entrypoint chowning /dev/stdout,
    # which fails under rootless podman and (with set -e) kills the container.
    # :Z on the config bind mount is needed for SELinux (enforcing hosts, eg. Fedora)
    # so the manticore process can actually read the file.
    # Manticore version is pinned to 14.1.0: it's the version piler 1.4.9 was
    # built/tested against; newer majors (eg. 25.x) break it.
    tty: true
    volumes:
      - ./config/manticore.conf:/etc/manticoresearch/manticore.conf:Z
      - piler_manticore:/var/lib/manticore
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M

  piler:
    build: .
    image: ${PILER_IMAGE:-piler-docker:latest}
    container_name: piler
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - MANTICORE_HOSTNAME=manticore
      - MEMCACHED_HOSTNAME=memcached
      - MYSQL_HOSTNAME=mysql
      - MYSQL_DATABASE=piler
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=piler123
      - PILER_HOSTNAME=${ARCHIVE_HOST:-archive.example.com}
      - RT=1
    ports:
      - "25:25"
      - "80:80"
      - "443:443"
    volumes:
      - piler_etc:/etc/piler
      - piler_store:/var/piler/store
      - piler_spool:/var/piler/tmp
    # Long enough for the drain in config/piler-run.sh; the 10s default would
    # SIGKILL the container mid-spool.
    stop_grace_period: 360s
    # Mirrors the image HEALTHCHECK, which podman's OCI format drops.
    healthcheck:
      test: curl -fsS http://localhost/ >/dev/null && curl -fsS --max-time 3 smtp://localhost:25/ >/dev/null
      interval: "20s"
      timeout: "3s"
      start_period: "15s"
      retries: 3
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M
    depends_on:
      - "mysql"
      - "memcached"
      - "manticore"

  memcached:
    image: memcached
    container_name: memcached
    command: -m 64

volumes:
  db_data: {}
  piler_etc: {}
  piler_manticore: {}
  piler_spool: {}
  piler_store: {}
