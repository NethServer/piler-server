services:
  mysql:
    # Series tag on an LTS: patches arrive on a plain pull, majors never do.
    image: mariadb:11.4
    # Prefixed: a bare "mysql" collides with any other stack on the host.
    container_name: piler-mysql
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - dac_override
      - setuid
      - setgid
    environment:
      - MYSQL_DATABASE=piler
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=piler123
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./config/piler.cnf:/etc/mysql/conf.d/piler.cnf:ro

  manticore:
    image: manticoresearch/manticore:14.1.0
    container_name: piler-manticore
    restart: unless-stopped
    # tty: true works around the manticore entrypoint chowning /dev/stdout,
    # which fails under rootless podman and (with set -e) kills the container.
    # :Z on the config bind mount is needed for SELinux (enforcing hosts, eg. Fedora)
    # so the manticore process can actually read the file.
    # Manticore version is pinned to 14.1.0: it's the version piler 1.4.9 was
    # built/tested against; newer majors (eg. 25.x) break it. Exact patch
    # because upstream publishes no 14.1 or 14 series tag.
    tty: true
    volumes:
      - ./config/manticore.conf:/etc/manticoresearch/manticore.conf:Z
      - piler_manticore:/var/lib/manticore
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M

  piler:
    image: ${PILER_IMAGE:-ghcr.io/nethserver/piler-server:latest}
    container_name: piler
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - MANTICORE_HOSTNAME=manticore
      - MEMCACHED_HOSTNAME=memcached
      - MYSQL_HOSTNAME=mysql
      - MYSQL_DATABASE=piler
      - MYSQL_USER=piler
      # No '%' in the password: piler's cron scripts parse piler.conf with
      # configparser, so the nightly purge dies on it (upstream bug).
      - MYSQL_PASSWORD=piler123
      - PILER_HOSTNAME=${ARCHIVE_HOST:-archive.example.com}
      # Optional, shown at their defaults. Uncommenting a port means moving
      # that service's own listener to match. A prefix also needs SITE_URL,
      # BRANDING_LOGO, BRANDING_FAVICON and SITE_LOGO_LG in config-site.php.
      # - RT=1                          # the only accepted value
      # - MYSQL_PORT=3306
      # - MANTICORE_PORT=9306
      # - MANTICORE_PORT_READONLY=9307
      # - MEMCACHED_PORT=11211
      # - PATH_PREFIX=/archive/
      # - ADMIN_USER_PASSWORD_HASH=      # no default; set to reset admin
      # - MYSQL_WAIT_MAX_ATTEMPTS=60
      # - PILER_STOP_DRAIN=1
      # - PILER_STOP_DRAIN_TIMEOUT=300
      # - PILER_STOP_DRAIN_INTERVAL=2
      # - PILER_USER=piler
    ports:
      - "25:25"
      - "80:80"
      - "443:443"
    volumes:
      - piler_etc:/etc/piler
      - piler_store:/var/piler/store
      - piler_spool:/var/piler/tmp
    # Long enough for the drain in config/piler-run.sh; the 10s default would
    # SIGKILL the container mid-spool.
    stop_grace_period: 360s
    # Mirrors the image HEALTHCHECK, which podman's OCI format drops.
    healthcheck:
      test: curl -fsS http://localhost/ >/dev/null && curl -fsS --max-time 3 smtp://localhost:25/ >/dev/null
      interval: "20s"
      timeout: "3s"
      start_period: "15s"
      retries: 3
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 512M
    depends_on:
      - "mysql"
      - "memcached"
      - "manticore"

  memcached:
    image: memcached:1.6-alpine
    container_name: piler-memcached
    command: -m 64

volumes:
  db_data: {}
  piler_etc: {}
  piler_manticore: {}
  piler_spool: {}
  piler_store: {}
