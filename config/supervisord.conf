[supervisord]
nodaemon=true
user=piler
# nodaemon=true already streams supervisord's own log to the console
# (stdout), so podman/journald capture why a program went FATAL. Don't also
# point logfile at stdout or every supervisord line is emitted twice; send
# the redundant file copy to /dev/null.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/piler/run/supervisord.pid

# Expose a control socket so `supervisorctl status/tail/restart` works when
# exec'ing into the container to debug a flapping program. chmod 0700 keeps
# the (unauthenticated) socket accessible only to the piler user.
[unix_http_server]
file=/var/piler/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/piler/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# supervisord's default behaviour is to give up on a crash-looping program
# (FATAL, after startretries/startsecs are exhausted) while supervisord and
# the container keep running, hiding the failure from the container's own
# restart policy. This listener kills supervisord (pid 1) as soon as any
# program goes FATAL, so the container exits and gets restarted from
# scratch by systemd/podman/compose instead of limping along with a dead
# service inside.
[eventlistener:exit-on-fatal]
command=/usr/bin/python3 /etc/supervisor/exit-on-fatal-listener.py
events=PROCESS_STATE_FATAL
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/bin/sh -c '/usr/local/bin/php-fpm --nodaemonize --fpm-config /etc/php/*/fpm/php-fpm.conf'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:supercronic]
command=/usr/local/bin/supercronic /etc/piler.cron
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# piler's own daemon forks and manages its pidfile itself (started once by
# entrypoint.sh before supervisord takes over). This watchdog restarts it if
# the process dies - rc.piler has no foreground mode to supervise directly.
# It keys off the pidfile's liveness, not rc.piler's exit code (which can be 0
# even when the daemon dies right after), and after a few consecutive failed
# recoveries it terminates supervisord (pid 1) itself so the container goes
# down and the orchestrator restarts it clean. supervisord can't reach that on
# its own here: the loop always stays RUNNING, so its exits never count toward
# startretries/FATAL. Same escalation exit-on-fatal does for the supervised
# programs it can see.
[program:piler-watchdog]
command=/bin/sh -c 'fails=0; while true; do pidfile=$(ls /var/piler/run/*.pid 2>/dev/null | head -n1); if [ -n "$pidfile" ] && kill -0 "$(cat "$pidfile")" 2>/dev/null; then fails=0; else fails=$((fails + 1)); if [ "$fails" -ge 3 ]; then echo "piler-watchdog: piler still down after $((fails - 1)) restart attempts, terminating supervisord to force a container restart" >&2; kill -TERM 1; exit 1; else echo "piler-watchdog: piler is down, restarting (attempt ${fails})" >&2; /etc/init.d/rc.piler start || true; fi; fi; sleep 10; done'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
