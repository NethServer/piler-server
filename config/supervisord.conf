[supervisord]
nodaemon=true
user=piler
# nodaemon already logs to stdout; keep the file copy off to avoid duplicates.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/piler/run/supervisord.pid

# Control socket for supervisorctl; 0700 = piler-only, filesystem-scoped.
[unix_http_server]
file=/var/piler/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/piler/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

# Kills supervisord (pid 1) when any program goes FATAL, so the container
# exits and the orchestrator restarts it instead of running a dead service.
[eventlistener:exit-on-fatal]
command=/usr/bin/python3 /etc/supervisor/exit-on-fatal-listener.py
events=PROCESS_STATE_FATAL
autorestart=true
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# priority: supervisord starts low-to-high, stops high-to-low. The archiver must
# come up before the intake and outlive it.
# stopwaitsecs is generous on purpose: the drain in piler-run.sh bounds the wait
# itself (PILER_STOP_DRAIN_TIMEOUT), supervisord must not SIGKILL mid-spool.
[program:piler]
command=/etc/supervisor/piler-run.sh
priority=100
autorestart=true
stopwaitsecs=3600
environment=LD_PRELOAD="/usr/local/lib/syslog-to-stderr.so"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# piler-smtp's listener has no SO_REUSEADDR, so a respawn needs up to ~60s of
# TIME_WAIT to clear before it can rebind port 25, exiting 1 until then. The
# default 3 retries would hit FATAL and take the container down meanwhile.
[program:piler-smtp]
command=/usr/sbin/piler-smtp
priority=200
autorestart=true
startretries=15
environment=LD_PRELOAD="/usr/local/lib/syslog-to-stderr.so"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=/bin/sh -c '/usr/local/bin/php-fpm --nodaemonize --fpm-config /etc/php/*/fpm/php-fpm.conf'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:supercronic]
command=/usr/local/bin/supercronic /etc/piler.cron
autorestart=true
environment=LD_PRELOAD="/usr/local/lib/syslog-to-stderr.so"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
