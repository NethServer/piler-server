name: lint

# Static checks and the offline entrypoint tests. Runs on every push and PR,
# including forks, because nothing here needs registry credentials or a build.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: shellcheck
        run: |
          # config/piler-run.sh is POSIX sh; shellcheck reads each shebang.
          docker run --rm -v "${PWD}:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning \
            entrypoint.sh \
            build-images.sh \
            release-tag.sh \
            dockerfile-vars.sh \
            config/piler-run.sh \
            tests/entrypoint-config-test.sh

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: hadolint
        run: |
          docker run --rm -i -v "${PWD}/.hadolint.yaml:/.hadolint.yaml" \
            hadolint/hadolint hadolint --no-color - < Dockerfile

  entrypoint-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The PHP assertions are the point of this job: they are what proves a
      # password with a quote in it lands in config-site.php as data.
      - name: Check php is available
        run: php --version

      - name: Config generation tests
        run: tests/entrypoint-config-test.sh
