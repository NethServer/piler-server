name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - config/**
      - build-images.sh
      - .github/workflows/build.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          base_image_tag=$(grep -oP '^ARG BASE_IMAGE=ubuntu:\K.*' Dockerfile)
          image="${REPOBASE}/piler-server"
          docker buildx build --file Dockerfile \
            --tag "${image}:${base_image_tag}" \
            --tag "${image}:latest" \
            --push .
          echo "image=${image}:latest" >> "$GITHUB_OUTPUT"

          {
            echo "### Image URLs"
            echo '```'
            echo "${image}:${base_image_tag}"
            echo "${image}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      image: ${{ steps.build.outputs.image }}
