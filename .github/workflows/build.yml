name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - config/**
      - build-images.sh
      - .github/workflows/build.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Dockerfile
      - entrypoint.sh
      - config/**
      - build-images.sh
      - .github/workflows/build.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        env:
          HEAD_REF: ${{ github.head_ref }}
          # For pull_request events, github.sha is the ephemeral merge
          # commit, not the branch tip - use the real head sha instead so
          # validate.yml's workflow_run.head_sha lookup finds this tag.
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${REPOBASE}/piler-server"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tag=$(echo "${HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')
          else
            tag="latest"
          fi

          short_sha="${SHA:0:7}"
          sha_tag="${tag}-${short_sha}"

          # Push a human-readable tag (branch name or "latest") plus a
          # branch+short-sha tag - validate.yml pins to the sha tag so it
          # always tests the exact commit it checked out, even if the
          # human-readable tag gets overwritten by a later push.
          docker buildx build --file Dockerfile \
            --tag "${image}:${tag}" \
            --tag "${image}:${sha_tag}" \
            --push .
          echo "image=${image}:${sha_tag}" >> "$GITHUB_OUTPUT"

          {
            echo "### Image URLs"
            echo '```'
            echo "${image}:${tag}"
            echo "${image}:${sha_tag}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
    outputs:
      image: ${{ steps.build.outputs.image }}
