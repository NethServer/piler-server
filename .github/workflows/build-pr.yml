name: build-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Dockerfile
      - entrypoint.sh
      - config/**
      - build-images.sh
      - .github/workflows/build-pr.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${REPOBASE}/piler-server"
          tag=$(echo '${{ github.head_ref }}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')
          docker buildx build --file Dockerfile \
            --tag "${image}:${tag}" \
            --push .
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
    outputs:
      image: ${{ steps.build.outputs.image }}
